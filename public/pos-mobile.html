<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#dc2626">
    <title>Fjoy's POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            width: 100%;
            touch-action: manipulation;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .menu-section {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .category-title {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            margin: 16px 0 8px 0;
            text-transform: uppercase;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .menu-item {
            background: white;
            border: 2px solid #fecaca;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            user-select: none;
            transition: all 0.2s;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: #fef2f2;
            border-color: #dc2626;
        }

        .menu-item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #111827;
            line-height: 1.3;
        }

        .menu-item-price {
            font-size: 18px;
            color: #dc2626;
            font-weight: 700;
        }

        .cart-section {
            background: white;
            border-top: 2px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            max-height: 45vh;
            flex-shrink: 0;
            overflow: hidden;
        }

        .cart-header {
            padding: 10px 16px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 80px;
            -webkit-overflow-scrolling: touch;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .cart-item-price {
            color: #6b7280;
            font-size: 11px;
        }

        .cart-item-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #dc2626;
            color: white;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .qty-btn:active {
            background: #991b1b;
        }

        .qty-display {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
        }

        .cart-summary {
            padding: 10px 16px;
            border-top: 2px solid #e5e7eb;
            flex-shrink: 0;
            background: white;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #dc2626;
            padding-top: 6px;
            border-top: 2px solid #e5e7eb;
            margin-bottom: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .btn-clear {
            background: #6b7280;
            color: white;
        }

        .btn-clear:active {
            background: #4b5563;
        }

        .btn-pay {
            background: #dc2626;
            color: white;
        }

        .btn-pay:active {
            background: #991b1b;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 18px;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .quick-amount-btn {
            padding: 12px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .quick-amount-btn:active {
            background: #e5e7eb;
        }

        .empty-cart {
            text-align: center;
            padding: 15px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* Ensure buttons are always visible */
        @supports (-webkit-touch-callout: none) {
            /* iOS specific */
            .app-container {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🍗 FJOY'S POS</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Online</span>
            </div>
        </div>

        <div class="main-content">
            <div class="menu-section" id="menuSection">
                <div class="category-title">Loading menu...</div>
            </div>

            <div class="cart-section">
                <div class="cart-header">Current Order</div>
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">Cart is empty</div>
                </div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-clear" id="clearBtn" disabled>Clear</button>
                        <button class="btn btn-pay" id="payBtn" disabled>Pay Cash</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-title">Cash Payment</div>
            <div class="input-group">
                <label>Total Amount: <span id="modalTotal">$0.00</span></label>
            </div>
            <div class="input-group">
                <label for="cashReceived">Cash Received:</label>
                <input type="number" id="cashReceived" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
                <div class="quick-amounts">
                    <button class="quick-amount-btn" data-amount="5">$5</button>
                    <button class="quick-amount-btn" data-amount="10">$10</button>
                    <button class="quick-amount-btn" data-amount="20">$20</button>
                    <button class="quick-amount-btn" data-amount="50">$50</button>
                    <button class="quick-amount-btn" data-amount="100">$100</button>
                    <button class="quick-amount-btn" id="exactBtn">Exact</button>
                </div>
            </div>
            <div class="input-group">
                <label>Change: <span id="changeAmount">$0.00</span></label>
            </div>
            <div class="action-buttons">
                <button class="btn btn-clear" id="cancelPayBtn">Cancel</button>
                <button class="btn btn-pay" id="completePayBtn" disabled>Complete</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin;
        const API_KEY = 'Fjoy3211';

        // State
        let cart = [];
        let products = [];
        let isOnline = navigator.onLine;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('POS App Starting...');
            await loadProducts();
            setupEventListeners();
            updateOnlineStatus();
        });

        // Load Products
        async function loadProducts() {
            console.log('Loading products from API...');
            try {
                const response = await fetch(`${API_BASE_URL}/api/products`, {
                    headers: { 'X-API-Key': API_KEY }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    products = data.data || [];
                    console.log('Products loaded:', products.length);
                } else {
                    console.error('API Error:', response.status);
                }
            } catch (error) {
                console.error('Failed to load products:', error);
            }
            
            renderMenu();
        }

        // Render Menu
        function renderMenu() {
            const menuSection = document.getElementById('menuSection');
            
            if (products.length === 0) {
                menuSection.innerHTML = `
                    <div class="category-title">No products available</div>
                    <div style="padding: 20px; text-align: center; color: #6b7280;">
                        <p>Unable to load menu items.</p>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">
                            Retry
                        </button>
                    </div>
                `;
                return;
            }
            
            // Group by category
            const categories = {};
            products.forEach(product => {
                const cat = product.category || 'Other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(product);
            });
            
            let html = '';
            Object.keys(categories).sort().forEach(category => {
                html += `<div class="category-title">${category}</div>`;
                html += '<div class="menu-grid">';
                categories[category].forEach(product => {
                    html += `
                        <div class="menu-item" data-product-id="${product.id}">
                            <div class="menu-item-name">${product.name}</div>
                            <div class="menu-item-price">$${parseFloat(product.price).toFixed(2)}</div>
                        </div>
                    `;
                });
                html += '</div>';
            });
            
            menuSection.innerHTML = html;
            
            // Add click listeners to menu items
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-product-id'));
                    addToCart(productId);
                });
            });
        }

        // Add to Cart
        function addToCart(productId) {
            // Convert to number to ensure match
            productId = parseInt(productId);
            
            const product = products.find(p => parseInt(p.id) === productId);
            
            if (!product) {
                console.error('Product not found:', productId);
                return;
            }
            
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: parseFloat(product.price),
                    quantity: 1
                });
            }
            
            renderCart();
        }

        // Update Quantity
        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;
            
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(item => item.id !== productId);
            }
            
            renderCart();
        }

        // Render Cart
        function renderCart() {
            const cartItems = document.getElementById('cartItems');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('total');
            const clearBtn = document.getElementById('clearBtn');
            const payBtn = document.getElementById('payBtn');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Cart is empty</div>';
                subtotalEl.textContent = '$0.00';
                totalEl.textContent = '$0.00';
                clearBtn.disabled = true;
                payBtn.disabled = true;
                return;
            }
            
            let html = '';
            let subtotal = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toFixed(2)} × ${item.quantity} = $${itemTotal.toFixed(2)}</div>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" data-product-id="${item.id}" data-delta="-1">−</button>
                            <div class="qty-display">${item.quantity}</div>
                            <button class="qty-btn" data-product-id="${item.id}" data-delta="1">+</button>
                        </div>
                    </div>
                `;
            });
            
            cartItems.innerHTML = html;
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            totalEl.textContent = `$${subtotal.toFixed(2)}`;
            clearBtn.disabled = false;
            payBtn.disabled = false;
            
            // Add click listeners to quantity buttons
            document.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = parseInt(this.getAttribute('data-product-id'));
                    const delta = parseInt(this.getAttribute('data-delta'));
                    updateQuantity(productId, delta);
                });
            });
        }

        // Clear Cart
        function clearCart() {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                renderCart();
            }
        }

        // Open Payment Modal
        function openPaymentModal() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('modalTotal').textContent = `$${total.toFixed(2)}`;
            document.getElementById('cashReceived').value = '';
            document.getElementById('changeAmount').textContent = '$0.00';
            document.getElementById('completePayBtn').disabled = true;
            document.getElementById('paymentModal').classList.add('active');
            setTimeout(() => document.getElementById('cashReceived').focus(), 100);
        }

        // Close Payment Modal
        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }

        // Calculate Change
        function calculateChange() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cashReceived = parseFloat(document.getElementById('cashReceived').value) || 0;
            const change = cashReceived - total;
            
            document.getElementById('changeAmount').textContent = `$${change.toFixed(2)}`;
            document.getElementById('completePayBtn').disabled = change < 0;
            
            return change;
        }

        // Complete Payment
        async function completePayment() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cashReceived = parseFloat(document.getElementById('cashReceived').value) || 0;
            const change = calculateChange();
            
            if (change < 0) {
                alert('Insufficient cash received');
                return;
            }
            
            const transaction = {
                transaction_id: `TXN-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                device_id: getDeviceId(),
                items: cart.map(item => ({
                    product_id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity
                })),
                subtotal: total,
                total: total,
                payment_method: 'cash',
                cash_received: cashReceived,
                change_given: change,
                transaction_date: new Date().toISOString()
            };
            
            // Try to sync to server
            try {
                const response = await fetch(`${API_BASE_URL}/api/transactions/sync`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({ transactions: [transaction] })
                });
                
                if (response.ok) {
                    console.log('Transaction synced successfully');
                }
            } catch (error) {
                console.log('Failed to sync transaction:', error);
            }
            
            alert(`Payment Complete!\n\nTotal: $${total.toFixed(2)}\nCash: $${cashReceived.toFixed(2)}\nChange: $${change.toFixed(2)}`);
            
            cart = [];
            renderCart();
            closePaymentModal();
        }

        // Get Device ID
        function getDeviceId() {
            let deviceId = localStorage.getItem('device_id');
            if (!deviceId) {
                deviceId = `DEVICE-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                localStorage.setItem('device_id', deviceId);
            }
            return deviceId;
        }

        // Update Online Status
        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (isOnline) {
                statusDot.classList.remove('offline');
                statusText.textContent = 'Online';
            } else {
                statusDot.classList.add('offline');
                statusText.textContent = 'Offline';
            }
        }

        // Setup Event Listeners
        function setupEventListeners() {
            document.getElementById('clearBtn').addEventListener('click', clearCart);
            document.getElementById('payBtn').addEventListener('click', openPaymentModal);
            document.getElementById('cancelPayBtn').addEventListener('click', closePaymentModal);
            document.getElementById('completePayBtn').addEventListener('click', completePayment);
            document.getElementById('cashReceived').addEventListener('input', calculateChange);
            
            document.getElementById('exactBtn').addEventListener('click', () => {
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                document.getElementById('cashReceived').value = total.toFixed(2);
                calculateChange();
            });
            
            document.querySelectorAll('.quick-amount-btn[data-amount]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.getElementById('cashReceived').value = this.getAttribute('data-amount');
                    calculateChange();
                });
            });
            
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        }

        console.log('POS App Loaded');
    </script>
</body>
</html>
