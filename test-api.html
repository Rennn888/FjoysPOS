<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Food Stand POS</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #4ec9b0; }
        .test-section { background: #252526; padding: 15px; margin: 15px 0; border-radius: 5px; border-left: 3px solid #007acc; }
        .test-title { color: #dcdcaa; font-weight: bold; margin-bottom: 10px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 3px; cursor: pointer; margin: 5px; }
        button:hover { background: #005a9e; }
        .result { background: #1e1e1e; padding: 10px; margin-top: 10px; border-radius: 3px; white-space: pre-wrap; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        input { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 8px; border-radius: 3px; width: 300px; }
        label { display: block; margin: 10px 0 5px 0; color: #9cdcfe; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Food Stand POS - API Test</h1>
        
        <div class="test-section">
            <div class="test-title">Configuration</div>
            <label>API Base URL:</label>
            <input type="text" id="apiUrl" value="http://localhost:8080">
            <label>API Key:</label>
            <input type="text" id="apiKey" value="your-secret-api-key-change-this">
        </div>

        <div class="test-section">
            <div class="test-title">Test 1: Get Products</div>
            <button onclick="testGetProducts()">Run Test</button>
            <div class="result" id="result1">Click button to test...</div>
        </div>

        <div class="test-section">
            <div class="test-title">Test 2: Sync Transaction</div>
            <button onclick="testSyncTransaction()">Run Test</button>
            <div class="result" id="result2">Click button to test...</div>
        </div>

        <div class="test-section">
            <div class="test-title">Test 3: Get Daily Sales</div>
            <button onclick="testDailySales()">Run Test</button>
            <div class="result" id="result3">Click button to test...</div>
        </div>

        <div class="test-section">
            <div class="test-title">Test 4: Authentication (Wrong Key)</div>
            <button onclick="testWrongAuth()">Run Test</button>
            <div class="result" id="result4">Click button to test...</div>
        </div>

        <div class="test-section">
            <div class="test-title">Run All Tests</div>
            <button onclick="runAllTests()">Run All Tests</button>
        </div>
    </div>

    <script>
        function getConfig() {
            return {
                apiUrl: document.getElementById('apiUrl').value,
                apiKey: document.getElementById('apiKey').value
            };
        }

        async function testGetProducts() {
            const result = document.getElementById('result1');
            result.textContent = 'Testing...';
            
            try {
                const config = getConfig();
                const response = await fetch(`${config.apiUrl}/api/products`, {
                    headers: { 'X-API-Key': config.apiKey }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'result success';
                    result.textContent = `✓ SUCCESS\n\nStatus: ${response.status}\nProducts found: ${data.data.length}\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `✗ FAILED\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `✗ ERROR\n\n${error.message}\n\nMake sure the server is running!`;
            }
        }

        async function testSyncTransaction() {
            const result = document.getElementById('result2');
            result.textContent = 'Testing...';
            
            try {
                const config = getConfig();
                const testTransaction = {
                    transactions: [{
                        transaction_id: `TEST-${Date.now()}`,
                        device_id: 'TEST-DEVICE',
                        items: [
                            { product_id: 1, name: 'Test Item', price: 5.99, quantity: 2 }
                        ],
                        subtotal: 11.98,
                        total: 11.98,
                        payment_method: 'cash',
                        cash_received: 20.00,
                        change_given: 8.02,
                        transaction_date: new Date().toISOString()
                    }]
                };
                
                const response = await fetch(`${config.apiUrl}/api/transactions/sync`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': config.apiKey
                    },
                    body: JSON.stringify(testTransaction)
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'result success';
                    result.textContent = `✓ SUCCESS\n\nStatus: ${response.status}\nSynced: ${data.synced}\nFailed: ${data.failed}\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `✗ FAILED\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `✗ ERROR\n\n${error.message}`;
            }
        }

        async function testDailySales() {
            const result = document.getElementById('result3');
            result.textContent = 'Testing...';
            
            try {
                const config = getConfig();
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`${config.apiUrl}/api/transactions/daily-sales?date=${today}`, {
                    headers: { 'X-API-Key': config.apiKey }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'result success';
                    result.textContent = `✓ SUCCESS\n\nStatus: ${response.status}\nDate: ${data.date}\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `✗ FAILED\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `✗ ERROR\n\n${error.message}`;
            }
        }

        async function testWrongAuth() {
            const result = document.getElementById('result4');
            result.textContent = 'Testing...';
            
            try {
                const config = getConfig();
                const response = await fetch(`${config.apiUrl}/api/products`, {
                    headers: { 'X-API-Key': 'wrong-key-12345' }
                });
                
                const data = await response.json();
                
                if (response.status === 401) {
                    result.className = 'result success';
                    result.textContent = `✓ SUCCESS (Auth working correctly)\n\nStatus: ${response.status}\nMessage: ${data.message}\n\n${JSON.stringify(data, null, 2)}`;
                } else {
                    result.className = 'result error';
                    result.textContent = `✗ FAILED (Should return 401)\n\nStatus: ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                result.className = 'result error';
                result.textContent = `✗ ERROR\n\n${error.message}`;
            }
        }

        async function runAllTests() {
            await testGetProducts();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testSyncTransaction();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testDailySales();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testWrongAuth();
        }
    </script>
</body>
</html>
